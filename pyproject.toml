[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "jatic_dota"
version = "0.2.0"
requires-python = ">=3.10,<3.13"
description = "A standalone distribution of BBAVectors-Oriented-Object-Detection and DAFNe for inference on the DOTA dataset."
authors = [
    { name = "Reference Implementation Team", email = "connect@quansight.com" },
]
dynamic = ["dependencies"]


[project.optional-dependencies]
dev = [
    "ipython",
    "ruff",
    "jupyterlab",
]

[project.scripts]
jatic-dota = "jatic_dota.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
  "jatic_dota._vendor.detectron2.tests*",
  "jatic_dota._vendor.detectron2.docs*",
  "jatic_dota._vendor.detectron2.projects*",
]

[tool.setuptools.package-data]
jatic_dota = ["resources/*"]
"jatic_dota._vendor.detectron2" = [
  "model_zoo/configs/**/*.yaml",
  "model_zoo/configs/**/*.py",
  "layers/csrc/**/*.h",
  "layers/csrc/**/*.hpp",
  "layers/csrc/**/*.cpp",
  "layers/csrc/**/*.cu",
  "../LICENSE",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
jatic_dota = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
torchvision = "==0.19.1"
shapely = ">2.0,<2.1"
pillow = "==11.1.0"
numpy = "==2.2.4"
httpx = "==0.28.1"
matplotlib = "==3.10.1"
tqdm = "==4.67.1"
opencv = "*"
fvcore = "==0.1.5.post20221221"
tensorboard = "*"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "==2.4.1"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.dev.tasks]
exc = "python script.py"

[tool.pixi.environments]
dev = ["dev", "py310", "cpu"]
